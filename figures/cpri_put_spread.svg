<text x="706" y="501" text-anchor="middle">25 Oct</text>
<text transform="translate(28,300) rotate(-90)" text-anchor="middle">Put vertical quoted price ($ per share)</text>
<text x="430" y="532" text-anchor="middle" font-size="12">Quote-side bars, not statistical confidence intervals</text>
</g>
<path d="M116 108 H805" stroke="#878e98" stroke-dasharray="7 5" stroke-width="1.6" fill="none"/>
