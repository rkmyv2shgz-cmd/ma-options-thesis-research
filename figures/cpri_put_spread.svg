<svg xmlns="http://www.w3.org/2000/svg" width="860" height="545" viewBox="0 0 860 545" role="img" aria-labelledby="t d">
<title id="t">CPRI $40/$35 put spread around the injunction, 23–25 October 2024</title>
<desc id="d">December 2024 expiry. Midpoint values: $1.60 on Oct 23, $1.65 on Oct 24, $4.90 on Oct 25. Vertical whiskers show two-leg quote-side ranges, not confidence intervals. Dotted line shows $5 terminal payoff cap.</desc>
<rect width="860" height="545" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#17243b">
<text x="430" y="38" text-anchor="middle" font-size="23" font-weight="600">CPRI: Dec 2024 $40/$35 put vertical</text>
<text x="430" y="63" text-anchor="middle" font-size="14" fill="#607087">Historical quotes around the October 2024 injunction</text>
</g>
<g stroke="#e0e6ed" stroke-width="1">
<line x1="116" y1="468" x2="805" y2="468"/>
<line x1="116" y1="396" x2="805" y2="396"/>
<line x1="116" y1="324" x2="805" y2="324"/>
<line x1="116" y1="252" x2="805" y2="252"/>
